name: Jarvis Android Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout v2026.7.1-2
        uses: actions/checkout@v4
        with:
          ref: v2026.7.1-2
          fetch-depth: 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build third-party debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleThirdPartyDebug --no-daemon --stacktrace

      - name: Locate APKs
        if: always()
        run: find apps/android -path '*outputs/apk*' -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-debug-v2026.7.1-2
          path: apps/android/**/outputs/apk/**/*.apk
          if-no-files-found: error
